<!DOCTYPE html>
<html lang="de" data-chrome="android">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#211f26" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f3edf7" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Homelab Operations Copilot — Proxmox- &amp; Docker-Topologie als PWA." />
  <meta name="application-name" content="HomelabOps" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HomelabOps" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script>
    /* Chrome detection before paint — auto: <lg → android (MY3E), lg+ → desktop (Fluent 2) */
    (function () {
      var pref = localStorage.getItem('hlops-chrome') || 'auto';
      var chrome = pref;
      if (pref === 'auto') {
        chrome = window.matchMedia('(min-width: 1024px)').matches ? 'desktop' : 'android';
      }
      if (chrome !== 'android' && chrome !== 'desktop' && chrome !== 'ios') chrome = 'android';
      document.documentElement.dataset.chrome = chrome;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: 'var(--primary)',
            surface: 'var(--surface-container)',
            card: 'var(--card)',
            muted: 'var(--on-surface-variant)',
          },
          fontFamily: {
            sans: ['var(--font)'],
            display: ['var(--font-display)'],
          },
          borderRadius: {
            chrome: 'var(--radius)',
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css" />
  {% block head %}{% endblock %}
</head>
<body class="antialiased">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-[var(--primary)] focus:px-3 focus:py-2 focus:text-[var(--on-primary)]">Zum Inhalt</a>

  <header class="app-header">
    <div class="app-header-inner">
      <a href="/" class="brand">
        Homelab<span>Ops</span>
      </a>
      <nav class="nav-desktop" aria-label="Hauptnavigation">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Topologie</a>
        <a href="/setup" class="{% if request.url.path == '/setup' %}active{% endif %}">Setup</a>
        <a href="/api/docs">API</a>
      </nav>
      <div class="flex items-center gap-2">
        <button type="button" id="btn-install" class="btn btn-ghost hidden !min-h-10 !px-3 !text-sm" aria-label="App installieren">Installieren</button>
        <time class="hidden text-sm text-[var(--muted)] lg:block" datetime="{{ now }}">{{ now }}</time>
      </div>
    </div>
  </header>

  <main id="main" class="main-shell">
    {% block content %}{% endblock %}
  </main>

  {# Material You 3 Expressive — flush NavigationBar (mobile only) #}
  <nav class="nav-android" aria-label="Mobile Navigation">
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">▣</span>
      Topologie
    </a>
    <a href="/setup" class="{% if request.url.path == '/setup' %}active{% endif %}">
      <span class="nav-icon" aria-hidden="true">⚙</span>
      Setup
    </a>
    <a href="/api/docs">
      <span class="nav-icon" aria-hidden="true">{ }</span>
      API
    </a>
  </nav>

  {% block fab %}{% endblock %}

  <script src="/static/js/chrome.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch((err) => {
          console.warn('SW registration failed', err);
        });
      });
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById('btn-install');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn?.classList.remove('hidden');
    });
    installBtn?.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.add('hidden');
    });
    window.addEventListener('appinstalled', () => {
      installBtn?.classList.add('hidden');
      deferredPrompt = null;
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
