{% extends "base.html" %}
{% block title %}Offline — {{ app_name }}{% endblock %}

{% block content %}
<section class="animate-in mx-auto max-w-md py-12 text-center">
  <p class="mb-2 text-sm font-medium uppercase tracking-wider text-[var(--accent)]">PWA</p>
  <h1 class="font-display text-3xl font-extrabold">Offline</h1>
  <p class="mt-3 text-[var(--muted)]">
    Keine Verbindung zum Copilot. Die Shell der App bleibt nutzbar — Topologie-Daten
    benötigen wieder Netzwerk.
  </p>
  <p class="mt-2 text-sm text-[var(--muted)]">{{ now }}</p>
  <button type="button" class="btn btn-primary mt-8" onclick="location.reload()">Erneut versuchen</button>
  <a href="/" class="btn btn-ghost mt-3 inline-flex">Zur Startseite</a>
</section>
{% endblock %}
