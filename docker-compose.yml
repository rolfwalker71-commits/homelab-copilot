# Production / remote: always pull from GHCR — never build on the server.
# Local build: docker compose -f docker-compose.yml -f docker-compose.build.yml build

services:
  homelab-copilot:
    image: ghcr.io/rolfwalker71-commits/homelab-copilot:${TAG:-latest}
    container_name: homelab-copilot
    ports:
      - "6655:6655"
    environment:
      TZ: Europe/Berlin
      PORT: "6655"
      DATA_DIR: /data
      MODULES_DIR: /app/modules
      DISCOVERY_INTERVAL_SECONDS: ${DISCOVERY_INTERVAL_SECONDS:-300}
      HEALTH_POLL_INTERVAL_SECONDS: ${HEALTH_POLL_INTERVAL_SECONDS:-300}
      PROXMOX_HOST: ${PROXMOX_HOST:-}
      PROXMOX_PORT: ${PROXMOX_PORT:-8006}
      PROXMOX_USER: ${PROXMOX_USER:-root@pam}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_PASSWORD: ${PROXMOX_PASSWORD:-}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-false}
      # false = discover Docker via SSH to LXCs (production default). true only with docker.sock below.
      DOCKER_USE_LOCAL_SOCKET: ${DOCKER_USE_LOCAL_SOCKET:-false}
      DOCKER_SSH_USER: ${DOCKER_SSH_USER:-root}
      DOCKER_SSH_KEY_PATH: /data/ssh/id_ed25519
      BACKUP_COPILOT_DIR: ${BACKUP_COPILOT_DIR:-/data/backups}
      BACKUP_LXC_DIR: ${BACKUP_LXC_DIR:-/var/backups/homelab-copilot}
      BACKUP_LXC_KEEP: ${BACKUP_LXC_KEEP:-2}
      BACKUP_COPILOT_KEEP: ${BACKUP_COPILOT_KEEP:-5}
      BACKUP_SYNOLOGY_KEEP: ${BACKUP_SYNOLOGY_KEEP:-10}
      BACKUP_SYNOLOGY_HOST: ${BACKUP_SYNOLOGY_HOST:-}
      BACKUP_SYNOLOGY_USER: ${BACKUP_SYNOLOGY_USER:-}
      BACKUP_SYNOLOGY_PATH: ${BACKUP_SYNOLOGY_PATH:-}
      BACKUP_SYNOLOGY_KEY_PATH: ${BACKUP_SYNOLOGY_KEY_PATH:-}
      BACKUP_SYNOLOGY_PORT: ${BACKUP_SYNOLOGY_PORT:-22}
      BACKUP_QUIESCE: ${BACKUP_QUIESCE:-true}
      BACKUP_SSH_TIMEOUT: ${BACKUP_SSH_TIMEOUT:-120}
      BACKUP_ARCHIVE_TIMEOUT: ${BACKUP_ARCHIVE_TIMEOUT:-3600}
      BACKUP_TRANSFER_TIMEOUT: ${BACKUP_TRANSFER_TIMEOUT:-3600}
      BACKUP_API_BASE: ${BACKUP_API_BASE:-http://127.0.0.1:6655}
      RESTIC_INSTALL: ${RESTIC_INSTALL:-true}
      RESTIC_INSTALL_TIMEOUT: ${RESTIC_INSTALL_TIMEOUT:-600}
      PATCHER_DAILY_ENABLED: ${PATCHER_DAILY_ENABLED:-true}
      PATCHER_DAILY_HOUR: ${PATCHER_DAILY_HOUR:-4}
      PATCHER_CRON: ${PATCHER_CRON:-}
      # LLM summary (OpenAI-compatible). Host .env alone is not enough — must be listed here.
      PATCHER_LLM_API_KEY: ${PATCHER_LLM_API_KEY:-}
      PATCHER_LLM_BASE_URL: ${PATCHER_LLM_BASE_URL:-https://api.openai.com/v1}
      PATCHER_LLM_MODEL: ${PATCHER_LLM_MODEL:-gpt-4o-mini}
      PATCHER_LLM_TIMEOUT: ${PATCHER_LLM_TIMEOUT:-60}
      PATCHER_SCAN_TIMEOUT: ${PATCHER_SCAN_TIMEOUT:-180}
      PATCHER_CONNECT_TIMEOUT: ${PATCHER_CONNECT_TIMEOUT:-15}
      PATCHER_APPLY_TIMEOUT: ${PATCHER_APPLY_TIMEOUT:-3600}
      PATCHER_INDEX_TIMEOUT: ${PATCHER_INDEX_TIMEOUT:-45}
      TOTP_COOKIE_DAYS: ${TOTP_COOKIE_DAYS:-30}
      TOTP_ISSUER: ${TOTP_ISSUER:-HomelabOps}
      TOTP_COOKIE_SECURE: ${TOTP_COOKIE_SECURE:-auto}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
    volumes:
      # Named volume ONLY for /data (SQLite, backups, …). Never also mount ./data:/data —
      # a bind mount overwrites the named volume → SQLite "unable to open database file" crash-loop.
      # App UID 10001 (appuser); the named volume is created with correct ownership.
      - copilot-data:/data
      # Optional: host Docker socket for local discovery. Leave commented on production
      # (use SSH to LXCs). If you enable this, also set DOCKER_USE_LOCAL_SOCKET=true.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # SSH private key ONLY (file → file). Key must exist as a FILE before compose up
      # (missing path → Docker creates a DIRECTORY → broken SSH / 0 containers discovered).
      # Wrong:  ./data:/data  or  key/dir mounted onto /data  → hides named volume.
      # Right:  copilot-data:/data + key file mounted onto /data/ssh/id_ed25519.
      # Prepare: mkdir -p data/ssh && install -m 600 id_ed25519 data/ssh/id_ed25519
      # Prod .env: DOCKER_SSH_KEY_HOST_PATH=/home/homelab-copilot/data/ssh/id_ed25519
      - ${DOCKER_SSH_KEY_HOST_PATH:-./data/ssh/id_ed25519}:/data/ssh/id_ed25519:ro
    restart: unless-stopped

volumes:
  copilot-data:
