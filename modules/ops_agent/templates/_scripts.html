{% from "_icons.html" import ico %}
<template id="ops-ico-play">{{ ico('play', 16) }}</template>
<script>
(function () {
  (function redirectLegacyOpsHash() {
    const map = {
      '#ops-scope': '/ops/hosts',
      '#ops-scope-list': '/ops/hosts',
      '#ops-interview': '/ops/regeln',
      '#ops-policy-form': '/ops/regeln',
      '#ops-activity': '/ops/log',
      '#ops-lessons': '/ops/log',
    };
    const dest = map[location.hash];
    if (!dest) return;
    const here = location.pathname.replace(/\/$/, '') || '/';
    if (here === dest) return;
    location.replace(dest);
  })();
  const $ = (id) => document.getElementById(id);
  const ICO_PLAY = ($('ops-ico-play') && $('ops-ico-play').innerHTML) || '';
  const BERLIN_TZ = 'Europe/Berlin';
  const nextSlotOpen = Object.create(null);
  let lastStartMsg = '';
  let lastBoard = {};
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  async function api(path, opts) {
    const res = await fetch('/api/modules/ops_agent' + path, Object.assign({
      headers: { 'Content-Type': 'application/json' },
    }, opts || {}));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || data.message || res.statusText);
    return data;
  }
  let scopeDirty = false;
  let scopeSaving = false;
  let scopeSaveTimer = 0;
  function fillPolicy(p) {
    if (!p) return;
    const kernel = $('pol-kernel');
    const first = $('pol-firstbak');
    const prod = $('pol-prod');
    const nothing = $('pol-nothing');
    if (!kernel || !first || !prod || !nothing) return;
    kernel.checked = !!p.confirm_kernel_docker;
    first.checked = !!p.confirm_new_guest_backup;
    prod.checked = !!p.confirm_production;
    nothing.checked = !!p.confirm_nothing;
  }
  function hasScopeMatrix() {
    return !!$('ops-scope-list');
  }
  function scopeKey(id) {
    return String(id == null ? '' : id).trim().toLowerCase();
  }
  function overlayDirtyTicks(hosts) {
    const rows = hosts || [];
    if (!scopeDirty && !scopeSaving) return rows;
    const local = collectScope();
    const patch = new Set((local.patch_scope_ids || []).map(scopeKey));
    const image = new Set((local.image_scope_ids || []).map(scopeKey));
    return rows.map((h) => {
      const tid = scopeKey(h.id || h.target_id);
      return Object.assign({}, h, { patch: patch.has(tid), image: image.has(tid) });
    });
  }
  function renderScope(hosts) {
    const root = $('ops-scope-list');
    if (!root) return;
    const rows = overlayDirtyTicks(hosts);
    if (!rows.length) {
      root.innerHTML = '<p class="text-sm text-[var(--muted)] leading-snug">Noch keine Hosts aus der Discovery. Nach dem nächsten Scan erscheinen sie hier.</p>';
      return;
    }
    root.innerHTML = rows.map((h) => {
      const gone = !!h.gone || h.present === false;
      const meta = [h.kind_label, h.node, gone ? 'weggefallen' : (h.online ? 'online' : 'offline')]
        .filter(Boolean).join(' · ');
      return (
        '<article class="entity-card ops-scope-row" role="listitem"' +
          (gone ? ' data-gone="1"' : '') + ' data-host-id="' + esc(h.id) + '">' +
          '<div class="min-w-0">' +
            '<p class="font-medium leading-snug break-words">' + esc(h.name || h.id) + '</p>' +
            '<p class="mt-0.5 text-sm text-[var(--muted)] leading-snug break-words">' + esc(meta) + '</p>' +
          '</div>' +
          '<label class="ops-scope-check">' +
            '<input type="checkbox" data-scope="patch" ' + (h.patch ? 'checked ' : '') +
              (gone ? 'disabled ' : '') + '/>' +
            '<span>Patchen</span>' +
          '</label>' +
          '<label class="ops-scope-check">' +
            '<input type="checkbox" data-scope="image" ' + (h.image ? 'checked ' : '') +
              (gone ? 'disabled ' : '') + '/>' +
            '<span>Images</span>' +
          '</label>' +
        '</article>'
      );
    }).join('');
  }
  function collectScope() {
    const patch = [];
    const image = [];
    document.querySelectorAll('#ops-scope-list [data-host-id]').forEach((row) => {
      const id = row.getAttribute('data-host-id');
      if (!id) return;
      const p = row.querySelector('input[data-scope="patch"]');
      const i = row.querySelector('input[data-scope="image"]');
      if (p && p.checked) patch.push(id);
      if (i && i.checked) image.push(id);
    });
    return { patch_scope_ids: patch, image_scope_ids: image };
  }
  function scheduleScopeSave() {
    scopeDirty = true;
    if (scopeSaveTimer) window.clearTimeout(scopeSaveTimer);
    scopeSaveTimer = window.setTimeout(() => { saveScope(); }, 280);
  }
  function waitScopeIdle() {
    return new Promise((resolve) => {
      const tick = () => {
        if (!scopeSaving) { resolve(); return; }
        window.setTimeout(tick, 30);
      };
      tick();
    });
  }
  async function saveScope(opts) {
    if (!hasScopeMatrix()) return;
    const silent = !!(opts && opts.silent);
    const msg = $('ops-scope-msg');
    if (scopeSaveTimer) {
      window.clearTimeout(scopeSaveTimer);
      scopeSaveTimer = 0;
    }
    if (scopeSaving) {
      scopeDirty = true;
      await waitScopeIdle();
      if (!scopeDirty) return;
    }
    scopeSaving = true;
    try {
      while (true) {
        const payload = collectScope();
        scopeDirty = false;
        const data = await api('/scope', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        if (!silent && msg) msg.textContent = data.message || 'Auswahl gespeichert.';
        if (!scopeDirty) break;
      }
    } catch (e) {
      scopeDirty = true;
      if (msg) msg.textContent = String(e.message || e);
    } finally {
      scopeSaving = false;
    }
  }
  async function flushScopeSave() {
    if (!hasScopeMatrix()) return;
    if (scopeSaveTimer) {
      window.clearTimeout(scopeSaveTimer);
      scopeSaveTimer = 0;
    }
    await waitScopeIdle();
    if (scopeDirty) await saveScope({ silent: true });
  }
  function promptCard(p) {
    const name = p.target_name || p.target_id || 'Host';
    if (p.kind === 'appeared') {
      return (
        '<article class="entity-card p-3" data-scope-prompt="' + esc(p.id) + '">' +
          '<p class="font-medium leading-snug break-words">Neuer Host/Gast ' + esc(name) + '</p>' +
          '<p class="mt-1 text-sm leading-snug break-words">Automatisch zu Patching? zu Image-Update? Backup-Intent merken? Stacks und tar/restic planst du auf der Backup-Seite.</p>' +
          '<div class="mt-2 grid gap-1">' +
            '<label class="flex items-center gap-2 text-sm min-h-12">' +
              '<input type="checkbox" data-prompt-patch class="h-4 w-4" /> <span>Patchen ja</span></label>' +
            '<label class="flex items-center gap-2 text-sm min-h-12">' +
              '<input type="checkbox" data-prompt-image class="h-4 w-4" /> <span>Images ja</span></label>' +
            '<label class="flex items-center gap-2 text-sm min-h-12">' +
              '<input type="checkbox" data-prompt-backup class="h-4 w-4" /> <span>Backup einplanen</span></label>' +
          '</div>' +
          '<div class="mt-2 flex flex-wrap gap-2">' +
            '<button type="button" class="btn btn-primary btn-xs min-h-12" data-prompt-save="' + esc(p.id) + '">Übernehmen</button>' +
          '</div>' +
        '</article>'
      );
    }
    if (p.kind === 'no_backup') {
      return (
        '<article class="entity-card p-3" data-scope-prompt="' + esc(p.id) + '">' +
          '<p class="font-medium leading-snug break-words">' + esc(name) + ' hat keinen Backup-Plan. So gewollt?</p>' +
          '<p class="mt-1 text-sm leading-snug break-words">Welche Stacks und ob tar oder restic, legst du auf der <a class="underline" href="/modules/backup_verifier">Backup-Seite</a> fest. Der Agent startet nur, was dort geplant ist — er erfindet keine Stacks. Kein Backup merkt sich der Agent.</p>' +
          '<div class="mt-2 flex flex-wrap gap-2">' +
            '<button type="button" class="btn btn-ghost btn-xs min-h-12" data-prompt-no-bak="' + esc(p.id) + '">Kein Backup</button>' +
            '<a class="btn btn-primary btn-xs min-h-12" href="/modules/backup_verifier">Backup einplanen</a>' +
          '</div>' +
        '</article>'
      );
    }
    return (
      '<article class="entity-card p-3" data-scope-prompt="' + esc(p.id) + '">' +
        '<p class="font-medium leading-snug break-words">' + esc(name) + ' ist weg</p>' +
        '<p class="mt-1 text-sm leading-snug break-words">Aus Patch- und Image-Liste nehmen? Bis du antwortest, plant der Agent dort nichts.</p>' +
        '<div class="mt-2 flex flex-wrap gap-2">' +
          '<button type="button" class="btn btn-primary btn-xs min-h-12" data-prompt-drop="' + esc(p.id) + '">Aus Liste nehmen</button>' +
          '<button type="button" class="btn btn-ghost btn-xs min-h-12" data-prompt-keep="' + esc(p.id) + '">Behalten, falls er zurückkommt</button>' +
        '</div>' +
      '</article>'
    );
  }
  function rollbackCard(s) {
    const st = s.status_label || (s.status === 'ok' ? 'Zurückgesetzt' : (s.status === 'skipped' ? 'Rollback übersprungen' : 'Rollback fehlgeschlagen'));
    const actor = s.actor_label || 'durch Agent';
    const meta = [s.job_kind_label, s.snap_name, s.created_at, actor].filter(Boolean).join(' · ');
    const why = [s.reason_label, s.error].filter(Boolean).join(' — ');
    return card((s.target_name || s.target_id || 'Host') + ' · ' + st, meta, why, '');
  }
  function card(title, meta, reason, actions) {
    return (
      '<article class="entity-card p-3">' +
        '<p class="font-medium leading-snug break-words">' + esc(title) + '</p>' +
        (meta ? '<p class="mt-0.5 text-sm text-[var(--muted)] leading-snug break-words">' + esc(meta) + '</p>' : '') +
        (reason ? '<p class="mt-1 text-sm leading-snug break-words">' + esc(reason) + '</p>' : '') +
        (actions ? '<div class="mt-2 flex flex-wrap gap-2">' + actions + '</div>' : '') +
      '</article>'
    );
  }
  function empty(text) {
    return '<p class="text-sm text-[var(--muted)] leading-snug">' + esc(text) + '</p>';
  }
  function startBtn(id) {
    return (
      '<button type="button" class="ops-next-start" data-ops-start="' + esc(id) +
        '" title="Jetzt starten" aria-label="Jetzt starten">' +
        ICO_PLAY +
        '<span class="ops-next-start-label">Jetzt starten</span>' +
      '</button>'
    );
  }
  function berlinParts(date) {
    const parts = new Intl.DateTimeFormat('de-DE', {
      timeZone: BERLIN_TZ,
      weekday: 'short',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    }).formatToParts(date);
    const out = {};
    parts.forEach((p) => { out[p.type] = p.value; });
    return out;
  }
  function berlinYmd(date) {
    const p = berlinParts(date);
    return p.year + '-' + p.month + '-' + p.day;
  }
  function nextYmd(ymd) {
    const d = new Date(ymd + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + 1);
    return berlinYmd(d);
  }
  function windowSlot(w) {
    let date = null;
    if (w.start_iso) {
      const parsed = new Date(w.start_iso);
      if (!isNaN(parsed.getTime())) date = parsed;
    }
    if (date) {
      const p = berlinParts(date);
      let hour = Number(p.hour);
      if (hour === 24) hour = 0;
      const minute = Math.floor(Number(p.minute) / 10) * 10;
      const hm = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
      const ymd = p.year + '-' + p.month + '-' + p.day;
      return {
        key: ymd + 'T' + hm,
        ymd: ymd,
        hm: hm,
        weekday: String(p.weekday || '').replace(/\.$/, ''),
        ms: date.getTime(),
      };
    }
    const raw = String(w.start_hm || '00:00');
    const m = raw.match(/(\d{1,2}):(\d{2})/);
    const hour = m ? Number(m[1]) : 0;
    const minute = m ? Math.floor(Number(m[2]) / 10) * 10 : 0;
    const hm = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
    return { key: 't-' + hm, ymd: '', hm: hm, weekday: '', ms: (hour * 60 + minute) * 60000 };
  }
  function slotDayLabel(slot) {
    if (!slot.ymd) return 'Heute';
    const today = berlinYmd(new Date());
    if (slot.ymd === today) return 'Heute';
    if (slot.ymd === nextYmd(today)) return 'Morgen';
    const bits = slot.ymd.split('-');
    const ddmm = bits[2] + '.' + bits[1] + '.';
    return (slot.weekday ? slot.weekday + ' ' : '') + ddmm;
  }
  function kindPlural(label, n) {
    if (n === 1) return label;
    if (label === 'Backup') return 'Backups';
    if (label === 'Patch') return 'Patches';
    if (label === 'Images') return 'Images';
    if (label === 'Restore-Drill') return 'Restore-Drills';
    return label + 's';
  }
  function kindCounts(items) {
    const order = ['Backup', 'Patch', 'Images', 'Restore-Drill'];
    const counts = Object.create(null);
    items.forEach((w) => {
      const mapped = { backup: 'Backup', patch: 'Patch', image: 'Images', drill: 'Restore-Drill' };
      const k = (w.bucket === 'images' || w.kind === 'image')
        ? 'Images'
        : (w.kind_label || mapped[w.kind] || 'Fenster');
      counts[k] = (counts[k] || 0) + 1;
    });
    return Object.keys(counts)
      .sort((a, b) => {
        const ia = order.indexOf(a);
        const ib = order.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'de');
      })
      .map((k) => counts[k] + ' ' + kindPlural(k, counts[k]))
      .join(' · ');
  }
  function groupNext(items) {
    const map = new Map();
    items.forEach((w) => {
      const slot = windowSlot(w);
      if (!map.has(slot.key)) map.set(slot.key, { slot: slot, items: [] });
      map.get(slot.key).items.push(w);
    });
    return Array.from(map.values()).sort((a, b) => {
      if (a.slot.ymd && b.slot.ymd && a.slot.ymd !== b.slot.ymd) {
        return a.slot.ymd < b.slot.ymd ? -1 : 1;
      }
      if (a.slot.hm !== b.slot.hm) return a.slot.hm < b.slot.hm ? -1 : 1;
      return a.slot.ms - b.slot.ms;
    });
  }
  function groupStartMs(g) {
    let min = Infinity;
    g.items.forEach((w) => {
      if (!w.start_iso) return;
      const t = new Date(w.start_iso).getTime();
      if (!isNaN(t) && t < min) min = t;
    });
    return min === Infinity ? g.slot.ms : min;
  }
  function upcomingSlotKey(groups) {
    const now = Date.now();
    for (let i = 0; i < groups.length; i++) {
      const g = groups[i];
      if (g.slot.ymd && groupStartMs(g) >= now) return g.slot.key;
    }
    return groups.length ? groups[0].slot.key : '';
  }
  function nextRow(w, slot) {
    const name = w.stack || w.target_name || w.target_id || 'Fenster';
    const actor = w.actor_label || (w.via_agent ? 'durch Agent' : '');
    const kind = w.kind_label && w.kind_label !== name ? w.kind_label : '';
    const line = [slot.hm || w.start_hm, name, kind, w.duration_label, actor]
      .filter(Boolean)
      .join(' · ');
    return (
      '<li class="ops-next-row">' +
        '<p class="ops-next-line">' + esc(line) + '</p>' +
        (w.can_start ? startBtn(w.id) : '') +
      '</li>'
    );
  }
  function renderNextList(items) {
    const groups = groupNext(items);
    const upcoming = upcomingSlotKey(groups);
    return groups.map((g) => {
      const key = g.slot.key;
      const isOpen = Object.prototype.hasOwnProperty.call(nextSlotOpen, key)
        ? nextSlotOpen[key]
        : key === upcoming;
      const header = slotDayLabel(g.slot) + ' ' + g.slot.hm + ' · ' + kindCounts(g.items);
      return (
        '<details class="ops-next-group" data-slot="' + esc(key) + '"' +
          (isOpen ? ' open' : '') + '>' +
          '<summary class="ops-next-summary">' +
            '<span class="ops-next-summary-inner">' +
              '<span class="ops-next-chevron" aria-hidden="true"></span>' +
              '<span class="ops-next-summary-text">' + esc(header) + '</span>' +
            '</span>' +
          '</summary>' +
          '<ul class="ops-next-list">' +
            g.items.map((w) => nextRow(w, g.slot)).join('') +
          '</ul>' +
        '</details>'
      );
    }).join('');
  }
  function windowTitle(w) {
    return (w.target_name || w.target_id || '') +
      (w.stack ? ' · ' + w.stack : '') +
      (w.kind_label ? ' · ' + w.kind_label : '');
  }
  function windowMark(w) {
    if (w.status === 'failed') return '✗';
    if (w.status === 'skipped') return '–';
    if (w.status === 'done' || w.status === 'success') return '✓';
    return '';
  }
  function windowShift(w) {
    if (!w.shift_mark) return '';
    const why = w.shift_reason && String(w.shift_reason).indexOf('Anschluss') >= 0 ? ' · Anschluss' : '';
    return w.shift_mark + why;
  }
  function timelineRow(phase, w, extra) {
    const mark = windowMark(w);
    const title = windowTitle(w);
    const actor = w.actor_label || (w.via_agent ? 'durch Agent' : '');
    const shift = windowShift(w);
    const meta = [w.start_de || w.start_hm, shift, w.duration_label, actor, extra]
      .filter(Boolean).join(' · ');
    const run = phase === 'Läuft';
    const actions = (run && w.id && String(w.id).indexOf('live:') !== 0)
      ? '<button type="button" class="btn btn-ghost btn-xs min-h-12" data-ops-decline="' + esc(w.id) + '">Loslassen</button>'
      : '';
    return (
      '<li class="ops-tl-row' + (run ? ' is-run' : '') + '">' +
        '<p class="ops-tl-phase">' + esc(phase) + '</p>' +
        '<div class="ops-tl-body">' +
          '<p class="ops-tl-title">' + esc(title) + (mark ? ' <span class="ops-tl-mark" aria-hidden="true">' + mark + '</span>' : '') + '</p>' +
          (meta ? '<p class="ops-tl-meta">' + esc(meta) + '</p>' : '') +
          (w.reason && phase !== 'Als Nächstes' ? '<p class="ops-tl-meta">' + esc(w.reason) + '</p>' : '') +
          actions +
        '</div>' +
      '</li>'
    );
  }
  function ledgerTable(rows) {
    if (!rows || !rows.length) return '';
    const body = rows.map((r) => {
      const name = r.label || r.target_name || r.target_id || '';
      return (
        '<tr>' +
          '<td class="break-words">' + esc(name) + '</td>' +
          '<td>' + esc(r.soll_hm || '—') + '</td>' +
          '<td>' + esc(r.ist_hm || '—') + '</td>' +
          '<td>' + esc(r.status_label || r.status || '') + '</td>' +
          '<td class="break-words">' + esc(r.reason || '') + '</td>' +
        '</tr>'
      );
    }).join('');
    return (
      '<div class="ops-ledger-wrap"><table class="ops-ledger-table">' +
        '<thead><tr><th>Ziel</th><th>Soll</th><th>Ist</th><th>Status</th><th>Hinweis</th></tr></thead>' +
        '<tbody>' + body + '</tbody>' +
      '</table></div>'
    );
  }
  function renderLedger(ledger) {
    const root = $('ops-ledger');
    if (!root) return;
    const data = ledger || {};
    const groups = [
      { title: 'Backup', rows: data.backups || [] },
      { title: 'Patch', rows: data.patches || [] },
      { title: 'Images', rows: data.images || [] },
    ];
    if (!groups.some((g) => g.rows.length)) {
      root.innerHTML = empty('Noch keine Soll/Ist-Zeilen — Zeitpläne und Matrix erscheinen hier.');
      return;
    }
    root.innerHTML = groups.map((g) => {
      if (!g.rows.length) {
        return '<div class="ops-ledger-group"><h3 class="font-display text-base font-bold leading-snug">' +
          esc(g.title) + '</h3><p class="mt-1 text-sm text-[var(--muted)] leading-snug">nichts offen</p></div>';
      }
      return '<div class="ops-ledger-group"><h3 class="font-display text-base font-bold leading-snug">' +
        esc(g.title) + '</h3>' + ledgerTable(g.rows) + '</div>';
    }).join('');
  }
  function renderWaiting(data) {
    const body = $('ops-waiting-body');
    if (!body) return;
    const items = data.waiting || [];
    const rbFails = (data.rollback_failed || []).map(rollbackCard).join('');
    const prompts = (data.scope_prompts || []).map(promptCard).join('');
    const wins = items.map((w) => {
      const offline = w.bucket === 'offline' || (w.reason && String(w.reason).indexOf('fällt auf') >= 0);
      const title = windowTitle(w) + (offline ? ' · fällt auf' : '');
      const meta = [w.start_de || w.start_hm, w.duration_label, w.bucket_label]
        .filter(Boolean).join(' · ');
      const actions =
        '<button type="button" class="btn btn-primary btn-xs min-h-12" data-ops-confirm="' + esc(w.id) + '">Bestätigen</button>' +
        '<button type="button" class="btn btn-ghost btn-xs min-h-12" data-ops-decline="' + esc(w.id) + '">Ablehnen</button>';
      return card(title, meta, w.reason || '', actions);
    }).join('');
    const html = rbFails + prompts + wins;
    body.innerHTML = html || empty('Nichts wartet auf dich. Der Agent arbeitet die übrigen Fenster selbst.');
  }
  function renderTimeline(data) {
    const root = $('ops-timeline');
    if (!root) return;
    const done = (data.done || []).slice().reverse();
    const running = data.running || [];
    const next = data.next || [];
    let html = '';
    html += '<li class="ops-tl-block"><p class="ops-tl-kicker">Gelaufen / Fail</p>';
    if (!done.length) {
      html += '<p class="text-sm text-[var(--muted)] leading-snug">Heute noch nichts abgeschlossen.</p>';
    } else {
      html += '<ol class="ops-timeline">' + done.map((w) => {
        let extra = w.status === 'failed' ? 'Fehler' : (w.status === 'skipped' ? 'übersprungen' : '');
        if (w.rollback && w.rollback.status === 'ok') extra = 'Zurückgesetzt';
        else if (w.rollback && w.rollback.status === 'failed') extra = 'Fehler · Rollback fehlgeschlagen';
        return timelineRow('Gelaufen', w, extra);
      }).join('') + '</ol>';
    }
    html += '</li>';
    html += '<li class="ops-tl-block"><p class="ops-tl-kicker">Läuft</p>';
    const scan = data.scan || {};
    const scanRow = scan.running
      ? timelineRow('Läuft', {
          target_name: 'Patch- und Image-Scan',
          stack: '',
          start_de: scan.message || 'Scan läuft…',
          duration_label: scan.total ? ((scan.current_index || 0) + '/' + scan.total) : '',
          reason: scan.current_target ? ('aktuell ' + scan.current_target) : '',
        }, 'Scan')
      : '';
    if (!running.length && !scanRow) {
      html += '<p class="text-sm text-[var(--muted)] leading-snug">—</p>';
    } else {
      html += '<ol class="ops-timeline">' +
        scanRow +
        running.map((w) => timelineRow('Läuft', w, w.bucket_label || '')).join('') +
      '</ol>';
    }
    html += '</li>';
    html += '<li class="ops-tl-block"><p class="ops-tl-kicker">Als Nächstes</p>';
    html += next.length
      ? renderNextList(next)
      : empty('Nichts geplant — „Plan vorschlagen“, „Scan jetzt“ oder bestehende Zeitpläne erscheinen hier.');
    html += '</li>';
    root.innerHTML = html;
  }
  function renderBoard(data) {
    lastBoard = data || {};
    const quiet = $('ops-quiet');
    if (quiet) quiet.textContent = data.quiet_rule || '';
    const en = $('ops-enabled');
    if (en) en.checked = !!data.enabled;
    fillPolicy(data.policy);
    renderScope(data.hosts || []);
    renderLessons(data.lessons || []);
    renderBrief(data);
    renderActivity(data.activity || []);
    renderLedger(data.ledger || {});
    renderWaiting(data);
    renderTimeline(data);
    applyScanUi(data.scan || null, { skipTimeline: true });
    bindActions();
    const need = $('ops-policy-needed');
    if (need) need.hidden = !!(data.policy && data.policy.answered);
    const interview = $('ops-interview');
    if (interview && data.policy && !data.policy.answered) {
      interview.hidden = false;
    }
    const runningNote = $('ops-running-note');
    if (runningNote && lastStartMsg) runningNote.textContent = lastStartMsg;
  }
  function renderLessons(items) {
    const title = $('ops-lessons-title');
    const list = $('ops-lessons-list');
    if (!title || !list) return;
    title.textContent = items.length ? ('Lektionen · ' + items.length) : 'Lektionen';
    if (!items.length) {
      list.innerHTML = empty('Noch keine Lektionen — Apply-Fehler und Rollbacks merkt der Agent hier.');
      return;
    }
    list.innerHTML = items.map((s) => {
      const actor = s.actor_label || 'durch Agent';
      const pkgs = (s.packages || []).join(', ');
      const meta = [s.job_kind_label, s.host_kind_label, pkgs, s.created_at, actor]
        .filter(Boolean).join(' · ');
      const why = s.why_de || s.error_label || '';
      return card((s.target_name || s.target_id || 'Host') + ' · Lektion', meta, [why, s.next_de].filter(Boolean).join(' '), '');
    }).join('');
  }
  function renderBrief(data) {
    const p = $('ops-brief');
    const at = $('ops-brief-at');
    if (p) p.textContent = data.brief || 'Heute noch keine Agent-Tätigkeit.';
    if (at) at.textContent = data.brief_at ? ('Stand ' + data.brief_at + ' · durch Agent') : '';
  }
  function renderActivity(items) {
    const title = $('ops-activity-title');
    const list = $('ops-activity-list');
    if (!title || !list) return;
    title.textContent = items.length ? ('Tätigkeitslog · ' + items.length) : 'Tätigkeitslog';
    if (!items.length) {
      list.innerHTML = empty('Noch keine Einträge — geplant, gestartet, verschoben, übersprungen und Warnungen erscheinen hier.');
      return;
    }
    list.innerHTML = items.map((s) => {
      const actor = s.actor_label || 'durch Agent';
      const who = s.target_name || s.target_id || '';
      const meta = [s.action_label, s.result, who, s.created_at, actor].filter(Boolean).join(' · ');
      return card(s.action_label || 'Eintrag', meta, s.detail || '', '');
    }).join('');
  }
  function bindActions() {
    document.querySelectorAll('[data-ops-confirm]').forEach((btn) => {
      btn.addEventListener('click', () => act('/confirm', btn.getAttribute('data-ops-confirm')));
    });
    document.querySelectorAll('[data-ops-decline]').forEach((btn) => {
      btn.addEventListener('click', () => act('/decline', btn.getAttribute('data-ops-decline')));
    });
    document.querySelectorAll('[data-ops-start]').forEach((btn) => {
      btn.addEventListener('click', () => act('/start', btn.getAttribute('data-ops-start')));
    });
    document.querySelectorAll('#ops-timeline details[data-slot]').forEach((el) => {
      el.addEventListener('toggle', () => {
        const slot = el.getAttribute('data-slot');
        if (slot) nextSlotOpen[slot] = el.open;
      });
    });
    document.querySelectorAll('[data-prompt-save]').forEach((btn) => {
      btn.addEventListener('click', () => answerPrompt(btn.getAttribute('data-prompt-save'), 'appeared'));
    });
    document.querySelectorAll('[data-prompt-no-bak]').forEach((btn) => {
      btn.addEventListener('click', () => answerPrompt(btn.getAttribute('data-prompt-no-bak'), 'no_backup_no'));
    });
    document.querySelectorAll('[data-prompt-yes-bak]').forEach((btn) => {
      btn.addEventListener('click', () => answerPrompt(btn.getAttribute('data-prompt-yes-bak'), 'no_backup_yes'));
    });
    document.querySelectorAll('[data-prompt-drop]').forEach((btn) => {
      btn.addEventListener('click', () => answerPrompt(btn.getAttribute('data-prompt-drop'), 'drop'));
    });
    document.querySelectorAll('[data-prompt-keep]').forEach((btn) => {
      btn.addEventListener('click', () => answerPrompt(btn.getAttribute('data-prompt-keep'), 'keep'));
    });
  }
  async function answerPrompt(id, mode) {
    const msg = $('ops-msg');
    const cardEl = document.querySelector('[data-scope-prompt="' + id + '"]');
    const body = { prompt_id: Number(id) };
    if (mode === 'appeared') {
      body.patch = !!(cardEl && cardEl.querySelector('[data-prompt-patch]')?.checked);
      body.image = !!(cardEl && cardEl.querySelector('[data-prompt-image]')?.checked);
      body.backup = !!(cardEl && cardEl.querySelector('[data-prompt-backup]')?.checked);
    } else if (mode === 'no_backup_yes') {
      body.backup = true;
    } else if (mode === 'no_backup_no') {
      body.backup = false;
    } else if (mode === 'drop') {
      body.drop = true;
    } else {
      body.drop = false;
    }
    try {
      await api('/scope-prompt', { method: 'POST', body: JSON.stringify(body) });
      if (msg) msg.textContent = 'Host-Frage übernommen.';
      await load();
    } catch (e) {
      if (msg) msg.textContent = String(e.message || e);
    }
  }
  async function act(path, id) {
    const msg = $('ops-msg');
    try {
      await api(path, { method: 'POST', body: JSON.stringify({ window_id: Number(id) }) });
      if (msg) msg.textContent = 'Aktualisiert.';
      await load();
    } catch (e) {
      if (msg) msg.textContent = String(e.message || e);
    }
  }
  async function load() {
    try {
      await flushScopeSave();
      const data = await api('/board');
      renderBoard(data);
    } catch (e) {
      const msg = $('ops-msg');
      if (msg) msg.textContent = String(e.message || e);
    }
  }
  async function plan() {
    const msg = $('ops-msg');
    try {
      const data = await api('/plan', { method: 'POST', body: '{}' });
      if (msg) msg.textContent = data.message || 'Plan übernommen.';
      await load();
    } catch (e) {
      if (msg) msg.textContent = String(e.message || e);
    }
  }
  async function startPlanned() {
    const msg = $('ops-msg');
    const note = $('ops-running-note');
    const btn = $('btn-ops-start-now');
    const prev = btn ? btn.textContent : '';
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Startet…';
    }
    lastStartMsg = 'Startet geplante Fenster…';
    if (note) note.textContent = lastStartMsg;
    if (msg) msg.textContent = lastStartMsg;
    try {
      const data = await api('/start-now', { method: 'POST', body: '{}' });
      lastStartMsg = data.message || 'Geplante Fenster gestartet — siehe Läuft.';
      if (msg) msg.textContent = lastStartMsg;
      if (note) note.textContent = lastStartMsg;
    } catch (e) {
      lastStartMsg = String(e.message || e);
      if (msg) msg.textContent = lastStartMsg;
      if (note) note.textContent = lastStartMsg;
    } finally {
      try {
        await load();
      } catch (_) { /* load setzt ops-msg selbst */ }
      if (btn) {
        btn.disabled = false;
        btn.textContent = prev || 'Geplante jetzt starten';
      }
    }
  }
  $('btn-ops-plan')?.addEventListener('click', plan);
  $('fab-ops-plan')?.addEventListener('click', plan);
  $('btn-ops-start-now')?.addEventListener('click', startPlanned);
  async function sleep(ms) {
    return new Promise((resolve) => window.setTimeout(resolve, ms));
  }
  function scanStatusText(scan) {
    if (!scan) return '';
    if (scan.error && !scan.running) return String(scan.error);
    const bits = [];
    if (scan.running) bits.push('Scan läuft…');
    if (scan.total) {
      bits.push((scan.current_index || 0) + '/' + scan.total);
      if (scan.percent != null) bits.push(scan.percent + ' %');
    }
    if (scan.current_target) bits.push(scan.current_target);
    const msg = String(scan.message || '').trim();
    if (msg && bits.indexOf(msg) < 0) bits.push(msg);
    if (!bits.length && scan.finished_at) bits.push('Scan fertig.');
    return bits.join(' · ');
  }
  function applyScanUi(scan, opts) {
    const skipTimeline = !!(opts && opts.skipTimeline);
    const btn = $('btn-ops-scan');
    const msg = $('ops-msg');
    const banner = $('ops-scan-banner');
    const running = !!(scan && scan.running);
    const text = scanStatusText(scan);
    if (btn) {
      btn.disabled = running;
      btn.textContent = running ? 'Scan läuft…' : 'Scan jetzt';
    }
    if (banner) {
      if (running || (scan && scan.error)) {
        banner.classList.remove('hidden');
        banner.textContent = text || (running ? 'Scan läuft… Patch- und Image-Prüfung.' : '');
      } else if (text && scan && scan.finished_at) {
        banner.classList.remove('hidden');
        banner.textContent = text;
      } else {
        banner.classList.add('hidden');
        banner.textContent = '';
      }
    }
    if (running && msg && text) msg.textContent = text;
    const act = $('ops-activity');
    if (running && act && !act.open) act.open = true;
    if (!skipTimeline && lastBoard && $('ops-timeline')) {
      lastBoard.scan = scan || lastBoard.scan || {};
      renderTimeline(lastBoard);
      bindActions();
    }
  }
  async function readScanStatus() {
    try {
      const st = await api('/scan-status');
      if (st && (st.running === true || st.running === false)) return st;
    } catch (_) { /* Fallback Patcher */ }
    try {
      const res = await fetch('/api/modules/patcher/scan-all/status');
      const st = await res.json().catch(() => ({}));
      if (res.ok) return st;
    } catch (_) {}
    return null;
  }
  async function scanNow() {
    const msg = $('ops-msg');
    applyScanUi({ running: true, message: 'Scan startet… Patch- und Image-Prüfung.' });
    if (msg) msg.textContent = 'Scan läuft… Patch- und Image-Prüfung aller Hosts.';
    try {
      let data = null;
      const res = await fetch('/api/modules/ops_agent/scan-now', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      data = await res.json().catch(() => ({}));
      if (res.status === 409) {
        data = (await readScanStatus()) || {
          running: true,
          message: data.detail || 'Scan läuft bereits…',
        };
      } else if (!res.ok) {
        throw new Error(data.detail || data.message || res.statusText);
      }
      applyScanUi(data);
      if (msg) msg.textContent = scanStatusText(data) || data.message || 'Scan läuft…';
      try { await load(); } catch (_) {}
      let last = data;
      for (let i = 0; i < 180; i++) {
        const st = await readScanStatus();
        if (st) {
          last = st;
          applyScanUi(st);
          if (msg) msg.textContent = scanStatusText(st) || st.message || msg.textContent;
          if (st.running === false) break;
        }
        await sleep(2000);
      }
      try {
        const planned = await api('/plan', { method: 'POST', body: '{}' });
        if (msg) msg.textContent = planned.message || last.message || 'Scan fertig — Fenster geplant.';
      } catch (_) { /* on_complete plant bereits */ }
      await load();
    } catch (e) {
      if (msg) msg.textContent = String(e.message || e);
      applyScanUi({ running: false, error: String(e.message || e) });
    } finally {
      const st = await readScanStatus();
      applyScanUi(st || { running: false });
    }
  }
  $('btn-ops-scan')?.addEventListener('click', scanNow);
  $('btn-ops-brief')?.addEventListener('click', async () => {
    const msg = $('ops-msg');
    try {
      const data = await api('/brief', { method: 'POST', body: '{}' });
      if (msg) msg.textContent = 'Kurzlage aktualisiert.';
      const p = $('ops-brief');
      if (p) p.textContent = data.brief || p.textContent;
      await load();
    } catch (e) {
      if (msg) msg.textContent = String(e.message || e);
    }
  });
  $('ops-scope-list')?.addEventListener('change', (ev) => {
    const t = ev.target;
    if (!t || !t.matches || !t.matches('input[data-scope]')) return;
    scheduleScopeSave();
  });
  $('btn-ops-scope')?.addEventListener('click', async () => {
    await saveScope();
    await load();
  });
  $('ops-enabled')?.addEventListener('change', async (ev) => {
    try {
      await api('/settings', {
        method: 'POST',
        body: JSON.stringify({ enabled: ev.target.checked, shift_auto: true }),
      });
      await load();
    } catch (e) {
      const msg = $('ops-msg');
      if (msg) msg.textContent = String(e.message || e);
    }
  });
  $('ops-policy-form')?.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = $('ops-policy-msg');
    try {
      await flushScopeSave();
      await api('/policy', {
        method: 'POST',
        body: JSON.stringify({
          confirm_kernel_docker: $('pol-kernel').checked,
          confirm_new_guest_backup: $('pol-firstbak').checked,
          confirm_production: $('pol-prod').checked,
          confirm_nothing: $('pol-nothing').checked,
          enabled: true,
        }),
      });
      if (msg) msg.textContent = 'Gespeichert. Der Agent arbeitet weiter selbst.';
      await load();
    } catch (e) {
      if (msg) msg.textContent = String(e.message || e);
    }
  });
  load();
  setInterval(load, 20000);
})();
</script>
